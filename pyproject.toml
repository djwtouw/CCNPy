[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "ccnpy"
version = "0.2.0"
description = "Classifier Chain Network for multi-label classification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Daniel J.W. Touw", email = "touw@ese.eur.nl" },
]
keywords = ["multi-label", "classification", "classifier-chain", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/djwtouw/CCNPy"
Issues = "https://github.com/djwtouw/CCNPy/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build-frontend = "build"
test-extras = ["test"]
test-command = "pytest {project}/tests"
# Eigen comes from the vendored submodule at extern/eigen (checked out in CI).
skip = ["pp*", "*-musllinux*"]
